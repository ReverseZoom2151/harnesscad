name: ci

# The repository had NO CI. `eval/selftest/` measured the harness -- precision
# per verifier, six-engine differential, metamorphic laws, field liveness -- and
# nothing enforced any of it. A rule with precision 0.4 could be merged the next
# day, and that is precisely the bug that lost the controlled experiment in
# assets/pressure/report.md (typed diagnostics lost to blind resampling by 8.3
# points; every net loss was a correct part broken because a false diagnostic
# told the model to break it).
#
# A capability the loop is not gated on is a decoration. This file is the gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  # -------------------------------------------------------------------------
  # 1. THE PRECISION FLOOR. The most important job in this file.
  #
  # eval/selftest/fleet_audit.py measures precision/recall PER VERIFIER over a
  # known-good and a known-bad corpus. eval/gates/precision_floor.py enforces a
  # COMMITTED floor per verifier:
  #   * a MODEL-FACING verifier (one whose codes are PROVEN/MEASURED and are
  #     therefore written into the model's retry prompt) must have precision 1.0;
  #   * a HEURISTIC verifier is pinned at its measured value and may not regress;
  #   * a verifier absent from the baseline fails the build outright.
  # -------------------------------------------------------------------------
  precision-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: fleet precision floor (fails if any model-facing verifier lies)
        run: python -m harnesscad.eval.gates.precision_floor
      - name: judge calibration gate (an uncalibrated judge may not instruct)
        run: python -m harnesscad.eval.gates.judge_gate

  # -------------------------------------------------------------------------
  # 2. The self-evaluation oracles, each as its own process.
  #
  # --strict turns a finding into a non-zero exit. differential and properties
  # need a geometry engine; frep is stdlib and always available, so these run on
  # a bare runner with no optional deps.
  # -------------------------------------------------------------------------
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oracle: [differential, golden]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: selftest --${{ matrix.oracle }} --strict
        run: python -m harnesscad.core.cli selftest --${{ matrix.oracle }} --backend frep --strict

  # -------------------------------------------------------------------------
  # 2a. The properties oracle -- metamorphic laws over a seeded 200-stream
  #     corpus. It was the pipeline's long pole (~33 min in one process); the
  #     corpus is a pure per-stream partition (no baseline, no cross-stream
  #     state), so we stripe it N-ways by stream index. Union of shards == the
  #     full run; any shard red => job red.
  # -------------------------------------------------------------------------
  properties:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: selftest --properties shard ${{ matrix.shard }}/8
        run: python -m harnesscad.core.cli selftest --properties --backend frep --strict --shard ${{ matrix.shard }} --nshard 8

  # -------------------------------------------------------------------------
  # 2b. The output gate. "Every artifact leaving the harness is either verified
  #     valid, or refused with a reason. There is no third outcome." Its property
  #     test is the only thing that keeps that sentence true.
  # -------------------------------------------------------------------------
  output-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python -m unittest tests.io.test_gate

  # -------------------------------------------------------------------------
  # 3. Field liveness: changing any op field must CHANGE the geometry.
  #
  # Three backends were silently dropping fields -- an op parameter the model
  # sets and the kernel ignores is a lie the grader cannot see. Runs only if the
  # oracle exists (a concurrent branch owns it); skipped, never silently passed.
  # -------------------------------------------------------------------------
  field-liveness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: field liveness ratchet (frep) shard ${{ matrix.shard }}/8
        # Each shard runs its (op, field) stripe's geometry and applies the
        # ratchet to the census entries for those cells (the census is keyed
        # per (backend, op, field), so the partition is exact). The global,
        # geometry-free `unmapped()` schema check runs in FULL in every shard.
        run: |
          if python -c "import harnesscad.eval.selftest.field_liveness" 2>/dev/null; then
            python -m harnesscad.eval.gates.liveness_floor --backend frep --shard ${{ matrix.shard }} --nshard 8
          else
            echo "field_liveness oracle not present on this ref; nothing to gate."
          fi

  # -------------------------------------------------------------------------
  # 4. The test suite, PER MODULE, each in its own process.
  #
  # A monolithic `unittest discover` SEGFAULTS at OCCT teardown, so a single
  # green tick from a discover run is not evidence. Each of the ~920 test modules
  # is run as an independent process; a crash in one is attributed to that one and
  # does not swallow the rest of the suite.
  # -------------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: run each test module as its own process, N-way parallel (shard ${{ matrix.shard }}/8)
        env:
          SHARD: ${{ matrix.shard }}
          NSHARD: "8"
        run: |
          set -uo pipefail
          # Each module still runs in its OWN process (a monolithic discover
          # segfaults at OCCT teardown; per-module isolation is why a green tick
          # means something). The only change here is CONCURRENCY: the ~1165
          # modules were run serially per shard, paying ~0.5s of interpreter
          # cold-start each. We now run this shard's modules `nproc`-way parallel
          # with per-process temp files -- same isolation, a fraction of the wall.
          run_one() {
            # A UNIT is a module, or a TestCase class / method inside one (the
            # planner splits the few giant modules so they stop being a floor).
            # Recover the owning file by walking back to the longest prefix that
            # is a real .py, so annotations still point at a clickable path.
            unit="$1"; mod="$unit"
            while [ -n "$mod" ] && [ ! -f "${mod//.//}.py" ]; do mod="${mod%.*}"; done
            f="${mod//.//}.py"
            out="$(mktemp)"
            t0=$(date +%s.%N)
            python -m unittest "$unit" >"$out" 2>&1
            rc=$?
            t1=$(date +%s.%N)
            # Per-unit wall time, machine-parseable. Attributed to BOTH the unit
            # and its module: module rows SUM back to a whole-module cost, while
            # the unit column gives the per-class/per-method cost that lets the
            # planner stop guessing an even split for the modules it divides.
            # Scraped to regenerate tests/module_runtimes.json.
            awk "BEGIN{printf \"MODTIME\\t%.2f\\t%s\\t%s\\n\", $t1-$t0, \"$mod\", \"$unit\"}"
            if [ "$rc" -eq 0 ]; then rm -f "$out"; return 0; fi
            # A nonzero exit is NOT automatically a test failure. cadquery/OCP
            # segfault the interpreter at teardown (exit 139), AFTER unittest has
            # already printed its verdict. So a module whose tests all pass and
            # then crashes on the way out exits nonzero while being green. We
            # forgive that -- and ONLY that -- by trusting unittest's printed
            # result: `OK` with no `FAILED`/`ERROR`/`Ran 0 tests` line means the
            # assertions passed and the crash is post-success teardown. Anything
            # else (a real FAILED/ERROR, a collection of zero tests, an import
            # crash before the verdict) is a genuine failure and still fails.
            if grep -qE '^OK($| )' "$out" \
               && ! grep -qE '^(FAILED|ERROR)' "$out" \
               && ! grep -qE 'Ran 0 tests' "$out"; then
              echo "::warning file=$f::$unit passed but crashed at teardown (rc=$rc, OCCT segfault) -- treated as pass"
              rm -f "$out"
              return 0
            fi
            echo "::error file=$f::FAILED $unit (rc=$rc)"
            tail -n 40 "$out"
            rm -f "$out"
            return 1
          }
          export -f run_one
          # Pack by MEASURED COST, not by name. Round-robin over the sorted file
          # list dealt the two ~850s pressure modules into different shards and
          # left others nearly idle (tests(7)=892s against tests(2)=205s), and the
          # matrix only finishes when its slowest shard does. shard_plan.py packs
          # longest-first into the lightest shard and splits the giants by
          # TestCase class/method so no single module is a floor. See its module
          # docstring; tests/test_shard_plan.py asserts the partition is exact.
          sel="$(mktemp)"
          python tests/shard_plan.py --shard "$SHARD" --nshard "$NSHARD" > "$sel"
          python tests/shard_plan.py --nshard "$NSHARD" --explain
          echo "shard $SHARD/$NSHARD: $(wc -l < "$sel") unit(s), $(nproc)-way parallel"
          # xargs keeps going on failures (no -exit) and returns 123 if any
          # invocation failed, so the whole shard runs and the step still fails
          # loudly if any module failed.
          xargs -a "$sel" -P "$(nproc)" -I{} bash -c 'run_one "$@"' _ {}

  # -------------------------------------------------------------------------
  # 5. The orphan ledger. A capability nothing imports is not a capability.
  #    Fails when the orphan count grows past the committed ceiling.
  # -------------------------------------------------------------------------
  orphans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: orphan ceiling
        run: python -m unittest tests.test_registry

  # -------------------------------------------------------------------------
  # 6. THE HELD-OUT ISOLATION GATE. A private test set stops being private the
  #    moment a second module can read it. This scans every source/test file and
  #    fails if any held-out brief split (corpus OR hardcorpus) is imported by
  #    anything but its sanctioned scorer -- the mitigation the audit prescribed
  #    for benchmark contamination (14.8.1) and Goodhart's Law (14.8.3), lifted
  #    from a unit test to a standing, first-class gate that covers both splits.
  # -------------------------------------------------------------------------
  heldout-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: held-out split reachable only through its scorer
        run: python -m harnesscad.eval.gates.heldout_isolation

  # -------------------------------------------------------------------------
  # 7. THE WARNING-CHANNEL GATE. precision_floor gates the ERROR channel; this
  #    gates the WARNING one. A verifier that WARNS on the majority of provably-
  #    correct parts is uncorrelated with correctness and trains its reader to
  #    ignore it -- "not a verifier". Built from the fleet_audit KNOWN_GOOD corpus
  #    (frep, always available); --with-redteam extends it with certified attacks.
  # -------------------------------------------------------------------------
  warning-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: no verifier warns on the majority of provably-correct parts
        run: python -m harnesscad.eval.gates.warning_channel --backend frep

  # -------------------------------------------------------------------------
  # 8. THE ORPHAN ENTRY POINTS. The six metric/preference modules the audit found
  #    "imported by nothing but their own test" now each have a runnable
  #    `python -m harnesscad.eval.entry.<name>` face. --selfcheck runs each on a
  #    fixed in-code fixture: it proves the wiring end to end with NO model, NO
  #    data file and NO geometry engine. A capability nothing can invoke is a
  #    decoration; this is the check that it can be invoked.
  # -------------------------------------------------------------------------
  entry-points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: every wired orphan is reachable and computes on its fixture
        run: |
          set -euo pipefail
          for m in judge_calibration judge_human_agreement metric_correlation \
                   pass_at_k ablation_matrix dpo_pairs; do
            echo "::group::eval.entry.$m"
            python -m "harnesscad.eval.entry.$m" --selfcheck >/dev/null
            echo "::endgroup::"
          done

  # -------------------------------------------------------------------------
  # 9. THE CORPUS GRADER, INCLUDING THE FULL MEASUREMENT VECTOR. The grader is
  #    many-to-one on the envelope families alone (a hole in the wrong place scores
  #    perfectly). eval/corpus/measurement.py composes the shape IoU and the SDF
  #    probes into one measurement vector the runner now reports; these tests drive
  #    the runner (property gate -> reference self-test -> grade -> vector) on frep.
  # -------------------------------------------------------------------------
  corpus-grader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: corpus grader and held-out isolation unit test
        run: |
          python -m unittest tests.eval.corpus.test_corpus
          python -m unittest tests.eval.corpus.test_holdout_isolation

  # -------------------------------------------------------------------------
  # 10. THE ORPHAN-PROVENANCE GATE. traceSDD lifted onto CISP: replay an op
  #     stream, attribute the measured geometry delta to the op that caused it,
  #     and fail on an ORPHAN OP (a build step that moved nothing measurable) or
  #     an ORPHAN FEATURE (measured geometry no op claims). --selfcheck drives
  #     the whole pure pipeline on a synthetic fixture with a planted orphan op
  #     and orphan feature -- NO model, NO kernel -- so it is safe on a bare
  #     runner. The real-session run is supplied a CISP program by its caller.
  # -------------------------------------------------------------------------
  orphan-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: orphan-provenance selfcheck (kernel-free synthetic fixture)
        run: python -m harnesscad.eval.gates.orphan_provenance --selfcheck

  # -------------------------------------------------------------------------
  # 11. THE VERIFIER-FLEET MUTATION SCORE GATE. TDAD semantic mutation testing
  #     over the differential oracle: inject the harness's defect classes into
  #     provably-good parts and score the fraction the fleet KILLS. A low score
  #     indicts the verifiers, not the parts. The real fleet needs kernels that
  #     may be absent here, so CI runs --selfcheck: synthetic verifiers + defects,
  #     NO kernel and NO model. The MS floor is a constant (DEFAULT_MS_FLOOR 0.9,
  #     overridable via --floor); it has no committed baseline artifact, and the
  #     real-fleet fleet run over live kernels belongs to the testing phase.
  # -------------------------------------------------------------------------
  mutation-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: verifier-fleet mutation score selfcheck (synthetic, no kernel)
        run: python -m harnesscad.eval.gates.mutation_score --selfcheck

  # -------------------------------------------------------------------------
  # 12. THE COVERAGE-MATRIX CENSUS + DRIFT PAUSE-GATE. Statically censuses every
  #     CISP op crossed with every (backend, format) the harness can emit and
  #     classifies each cell IMPLEMENTED / REFUSED / UNKNOWN off DECLARED backend
  #     metadata -- no kernel, no model. --selfcheck proves the classifier and a
  #     drift-down FAILURE on a synthetic fixture. Then the live census runs
  #     against the COMMITTED baseline (coverage_baseline.json): a drop in fill
  #     rate or a growth in UNKNOWN cells fails the build. REFUSED is honest,
  #     filled coverage; only UNKNOWN cells are debt.
  # -------------------------------------------------------------------------
  coverage-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: coverage-matrix selfcheck (synthetic classification + drift-down)
        run: python -m harnesscad.eval.gates.coverage_matrix --selfcheck
      - name: coverage-matrix drift gate against the committed baseline
        run: python -m harnesscad.eval.gates.coverage_matrix --baseline src/harnesscad/eval/gates/coverage_baseline.json
